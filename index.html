<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoFix</title>
<meta name="description" content="VideoFix – download videos, trim, split and extract audio on Android.">
<meta name="theme-color" content="#0d9488">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230d9488'/%3E%3Cpath d='M38 30v40l32-20z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f8f7; --bg2: #e6f2f0; --card: rgba(255,255,255,.82); --card-solid: #ffffff;
    --text: #0f1f1d; --muted: #4b6360; --border: rgba(13,148,136,.16);
    --accent: #0d9488; --accent2: #0891b2; --accent-soft: rgba(13,148,136,.10); --on-accent: #ffffff;
    --tg: #229ed9; --shadow: 0 10px 30px -12px rgba(15,60,55,.25); --glow: rgba(13,148,136,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #071413; --bg2: #0b1e1c; --card: rgba(18,38,36,.78); --card-solid: #122624;
      --text: #e8f5f3; --muted: #9bb8b4; --border: rgba(45,212,191,.16);
      --accent: #2dd4bf; --accent2: #38bdf8; --accent-soft: rgba(45,212,191,.12); --on-accent: #04201d;
      --shadow: 0 10px 30px -12px rgba(0,0,0,.6); --glow: rgba(45,212,191,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #071413; --bg2: #0b1e1c; --card: rgba(18,38,36,.78); --card-solid: #122624;
    --text: #e8f5f3; --muted: #9bb8b4; --border: rgba(45,212,191,.16);
    --accent: #2dd4bf; --accent2: #38bdf8; --accent-soft: rgba(45,212,191,.12); --on-accent: #04201d;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.6); --glow: rgba(45,212,191,.35);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
    line-height: 1.65; overflow-x: hidden; transition: background .4s, color .4s;
  }
  /* Soft moving light blobs behind everything */
  .blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blobs i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(70px); opacity: .45; animation: float 22s ease-in-out infinite alternate; }
  .blobs i:nth-child(1) { background: var(--accent); top: -18vmax; inset-inline-start: -14vmax; }
  .blobs i:nth-child(2) { background: var(--accent2); bottom: -20vmax; inset-inline-end: -16vmax; animation-delay: -8s; opacity: .3; }
  @keyframes float { to { transform: translate(6vmax, 5vmax) scale(1.12); } }

  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent2); outline-offset: 3px; border-radius: 10px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Top bar */
  .bar {
    position: sticky; top: 0; z-index: 10; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg) 70%, transparent); border-bottom: 1px solid var(--border);
  }
  .bar-in { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; color: var(--text); text-decoration: none; margin-inline-end: auto; }
  .brand .mini { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; }
  .seg { display: flex; background: var(--accent-soft); border-radius: 999px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; cursor: pointer; transition: .25s; min-height: 34px;
  }
  .seg button[aria-pressed="true"] { background: var(--card-solid); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--card);
    color: var(--text); display: grid; place-items: center; cursor: pointer; transition: transform .3s;
  }
  .icon-btn:hover { transform: rotate(20deg); }

  main { max-width: 980px; margin: 0 auto; padding: 0 16px 56px; }

  /* Hero */
  .hero { text-align: center; padding: 48px 0 8px; }
  .logo-wrap { position: relative; display: inline-block; }
  .logo {
    position: relative; width: 104px; height: 104px; border-radius: 30px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 18px 40px -12px var(--glow);
    animation: bob 4s ease-in-out infinite;
  }
  .logo-wrap::before, .logo-wrap::after {
    content: ""; position: absolute; inset: 0; border-radius: 30px; border: 2px solid var(--accent); opacity: 0;
    animation: ring 3s ease-out infinite;
  }
  .logo-wrap::after { animation-delay: 1.5s; }
  @keyframes ring { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.7); opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  h1 {
    font-size: clamp(36px, 8vw, 56px); line-height: 1.15; margin: 22px 0 8px; font-weight: 800; letter-spacing: -.5px;
    background: linear-gradient(90deg, var(--text), var(--accent), var(--accent2), var(--text));
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: sheen 9s linear infinite;
  }
  @keyframes sheen { to { background-position: 300% 0; } }
  .tagline { color: var(--muted); font-size: clamp(17px, 3.6vw, 20px); margin: 0 auto 22px; max-width: 560px; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 26px; padding: 0; list-style: none; }
  .chips li {
    display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-size: 14px;
    background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(8px);
  }
  .chips b { color: var(--accent); font-weight: 800; }
  .chips svg { color: var(--accent); }

  /* Download card */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 26px; padding: 26px;
    box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .dl { max-width: 520px; margin: 0 auto; text-align: center; }
  .download {
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 17px 20px; border-radius: 18px; border: 0; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--on-accent);
    font: inherit; font-size: 20px; font-weight: 800; text-decoration: none;
    box-shadow: 0 12px 28px -10px var(--glow); transition: transform .2s, box-shadow .2s;
  }
  .download::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%; inset-inline-start: -60%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-20deg);
    animation: shine 3.5s ease-in-out infinite;
  }
  @keyframes shine { 0%, 60% { inset-inline-start: -60%; } 100% { inset-inline-start: 130%; } }
  .download:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -10px var(--glow); }
  .download:active { transform: scale(.97); }
  .download svg { flex: none; }
  .download.tg { background: linear-gradient(135deg, var(--tg), #1c7fc0); color: #fff; box-shadow: 0 12px 28px -10px rgba(34,158,217,.5); }
  .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.5); transform: scale(0); animation: rip .6s ease-out; pointer-events: none; }
  @keyframes rip { to { transform: scale(4); opacity: 0; } }
  .meta { color: var(--muted); font-size: 14px; margin-top: 10px; }
  .badge-safe { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .badge-safe svg { color: var(--accent); }
  #qr { display: inline-block; background: #fff; padding: 12px; border-radius: 16px; margin: 14px 0 4px; box-shadow: var(--shadow); }
  #qr img, #qr canvas { display: block; }
  .phone-hint { margin: 22px 0 0; }

  details.more { margin-top: 18px; text-align: start; border-top: 1px solid var(--border); padding-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 15px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; min-height: 40px; }
  summary::-webkit-details-marker { display: none; }
  summary .chev { transition: transform .3s; margin-inline-start: auto; }
  details[open] > summary .chev { transform: rotate(180deg); }
  ul.files { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.files li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--border); font-size: 15px; }
  ul.files a { color: var(--on-accent); background: var(--accent); padding: 6px 14px; border-radius: 10px; text-decoration: none; font-weight: 700; white-space: nowrap; }
  ul.files span { color: var(--muted); }

  /* Sections */
  section.block { margin-top: 64px; }
  .eyebrow { display: block; text-align: center; color: var(--accent); font-weight: 700; font-size: 14px; letter-spacing: .5px; }
  h2 { font-size: clamp(24px, 5vw, 32px); text-align: center; margin: 4px 0 26px; font-weight: 800; }

  /* Install steps */
  .progress { max-width: 620px; margin: 0 auto 14px; display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
  .progress .track { flex: 1; height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
  .progress .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
  ol.steps { list-style: none; padding: 0; margin: 0 auto; max-width: 620px; display: grid; gap: 12px; }
  ol.steps button {
    width: 100%; display: flex; align-items: flex-start; gap: 14px; text-align: start; cursor: pointer;
    background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px;
    color: var(--text); font: inherit; font-size: 16px; transition: .3s;
  }
  ol.steps button:hover { border-color: var(--accent); transform: translateX(calc(var(--dirx, 1) * -3px)); }
  .num {
    flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800;
    background: var(--accent-soft); color: var(--accent); transition: .3s;
  }
  ol.steps button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  ol.steps button[aria-pressed="true"] .num { background: var(--accent); color: var(--on-accent); transform: scale(1.08); }
  ol.steps .txt { padding-top: 4px; }
  ol.steps .flash { animation: flash 1.4s ease 2; }
  @keyframes flash { 50% { box-shadow: 0 0 0 6px var(--glow); } }
  .steps-hint { text-align: center; color: var(--muted); font-size: 14px; margin: 12px 0 0; }

  /* Features */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .feature {
    position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px;
    transition: transform .35s, border-color .35s, box-shadow .35s; overflow: hidden;
  }
  .feature:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow); }
  .feature .ic {
    width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 10px;
    background: linear-gradient(135deg, var(--accent-soft), transparent); color: var(--accent); border: 1px solid var(--border);
  }
  .feature h3 { font-size: 17px; margin: 0 0 4px; }
  .feature p { color: var(--muted); font-size: 15px; margin: 0; }

  /* FAQ */
  .faq { max-width: 680px; margin: 0 auto; display: grid; gap: 10px; }
  .faq details { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 4px 18px; transition: border-color .3s; }
  .faq details[open] { border-color: var(--accent); }
  .faq summary { color: var(--text); font-size: 16px; padding: 10px 0; }
  .faq p { margin: 0 0 14px; color: var(--muted); }

  /* Telegram */
  .telegram { text-align: center; max-width: 620px; margin: 64px auto 0; position: relative; overflow: hidden; }
  .telegram::before { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%; background: var(--tg); opacity: .12; filter: blur(30px); top: -80px; inset-inline-end: -60px; }
  .telegram .tg-ic { width: 60px; height: 60px; border-radius: 50%; background: var(--tg); display: inline-grid; place-items: center; margin-bottom: 6px; }
  .telegram h2 { margin-bottom: 6px; }
  .telegram p { color: var(--muted); margin: 0 0 18px; }

  footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 48px; }

  /* Toast + back to top */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 140%); z-index: 20;
    background: var(--card-solid); color: var(--text); border: 1px solid var(--accent); border-radius: 16px;
    padding: 12px 18px; box-shadow: var(--shadow); max-width: calc(100% - 32px); width: max-content;
    display: flex; gap: 10px; align-items: center; transition: transform .45s cubic-bezier(.2,.9,.3,1.3); font-weight: 600;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast svg { color: var(--accent); flex: none; }
  .top {
    position: fixed; bottom: 20px; inset-inline-end: 16px; z-index: 15; opacity: 0; pointer-events: none;
    transform: translateY(12px); transition: .3s; background: var(--accent); color: var(--on-accent); border: 0;
    width: 48px; height: 48px; border-radius: 50%; box-shadow: var(--shadow); cursor: pointer; display: grid; place-items: center;
  }
  .top.show { opacity: 1; pointer-events: auto; transform: none; }

  /* Reveal on scroll */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }

  [hidden] { display: none !important; }

  @media (max-width: 480px) {
    .card { padding: 20px 16px; }
    .brand span { display: none; }
    .seg button { padding: 5px 9px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i></div>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#top" aria-label="VideoFix">
      <span class="mini" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg></span>
      <span aria-hidden="true">VideoFix</span>
    </a>
    <nav class="seg" aria-label="Language">
      <button type="button" data-lang="ar">العربية</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="de">Deutsch</button>
    </nav>
    <button type="button" class="icon-btn" id="theme"><svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="logo-wrap" aria-hidden="true">
      <div class="logo"><svg width="50" height="50" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg></div>
    </div>
    <h1>VideoFix</h1>
    <p class="tagline" data-t="tagline"></p>
    <ul class="chips" id="chips"></ul>

    <div class="card dl reveal">
      <!-- Android: one button, pre-picked for this phone -->
      <div id="android" hidden>
        <a class="download" id="mainLink" href="#">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>
          <span data-t="download"></span>
        </a>
        <div class="meta" id="mainMeta"></div>
      </div>
      <!-- Anything else: direct download plus a QR code to open the page on a phone -->
      <div id="other" hidden>
        <a class="download" id="desktopLink" href="#">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>
          <span data-t="download"></span>
        </a>
        <div class="meta" id="desktopMeta"></div>
        <p class="phone-hint" data-t="openOnPhone"></p>
        <div id="qr" aria-hidden="true"></div>
        <div class="meta" data-t="scan"></div>
      </div>
      <div class="badge-safe">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
        <span data-t="safe"></span>
      </div>

      <details class="more">
        <summary><span data-t="otherDevices"></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
        <ul class="files" id="fileList"></ul>
      </details>
    </div>
  </section>

  <section class="block reveal" id="install" aria-labelledby="installTitle">
    <span class="eyebrow" data-t="installEyebrow" aria-hidden="true"></span>
    <h2 id="installTitle" data-t="installTitle"></h2>
    <div class="progress" aria-hidden="true"><div class="track"><div class="fill" id="fill"></div></div><span id="progressText"></span></div>
    <ol class="steps" id="steps"></ol>
    <p class="steps-hint" data-t="stepsHint"></p>
  </section>

  <section class="block" aria-labelledby="featuresTitle">
    <span class="eyebrow reveal" data-t="featuresEyebrow" aria-hidden="true"></span>
    <h2 id="featuresTitle" class="reveal" data-t="featuresTitle"></h2>
    <div class="grid" id="features"></div>
  </section>

  <section class="block reveal" aria-labelledby="faqTitle">
    <span class="eyebrow" data-t="faqEyebrow" aria-hidden="true"></span>
    <h2 id="faqTitle" data-t="faqTitle"></h2>
    <div class="faq" id="faq"></div>
  </section>

  <section class="card telegram reveal" aria-labelledby="tgTitle">
    <div class="tg-ic" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24"><path fill="#fff" d="M21.4 4.2 2.9 11.3c-1.3.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.4l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.5zM8.6 14l9.6-6.1c.5-.3.9-.1.5.2l-8.2 7.4-.3 3.4z"/></svg></div>
    <h2 id="tgTitle" data-t="tgTitle"></h2>
    <p data-t="tgText"></p>
    <a class="download tg" href="https://t.me/EzTechApps"><span data-t="tgButton"></span></a>
  </section>

  <footer data-t="footer"></footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>
  <span id="toastText"></span>
</div>
<button type="button" class="top" id="toTop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const REPO = "Ezeddin-20/VideoFix";
  // "latest/download/<name>" always resolves to the newest release, so this page never
  // needs editing for an update — as long as the APK file names stay the same.
  const fileUrl = name => `https://github.com/${REPO}/releases/latest/download/${name}`;
  const FILES = [
    { abi: "arm64-v8a",   name: "VideoFix-arm64-v8a.apk" },
    { abi: "armeabi-v7a", name: "VideoFix-armeabi-v7a.apk" },
    { abi: "universal",   name: "VideoFix-universal.apk" },
  ];
  // Listed under "if the app doesn't work"; arm64 is the main button.
  const LISTED = ["armeabi-v7a", "universal"];

  // Feature icons, same order as T.<lang>.features (24x24 stroke paths).
  const ICONS = [
    "M12 3v12m0 0-5-5m5 5 5-5M5 21h14",
    "M4 6h12M4 12h12M4 18h7M17 15l5 3-5 3z",
    "M3 6h18v12H3zM8 14v-2M12 14v-4M16 14V9",
    "M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5",

      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function pickLanguage() {
    try {
      const saved = localStorage.getItem("lang");
      if (saved && T[saved]) return saved;
    } catch (_) {}
    const nav = (navigator.language || "ar").slice(0, 2);
    return T[nav] ? nav : "en";
  }

  (async () => {
    try {
      const theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (_) {}
    matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", renderTheme);
    lang = pickLanguage();
    $(isAndroid ? "android" : "other").hidden = false;
    if (isAndroid) pickedAbi = await detectAbi();
    else if (window.QRCode) new QRCode($("qr"), { text: location.href, width: 180, height: 180 });
    render();
    try {
      // One request gives both: the newest release (list is newest first) and all download counts.
      const res = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`);
      if (res.ok) {
        const all = (await res.json()).filter(r => !r.draft && !r.prerelease);
        totalDownloads = all.flatMap(r => r.assets).reduce((sum, a) => sum + a.download_count, 0);
        const latest = all[0];
        if (latest) release = { tag: latest.tag_name.replace(/^v/i, ""), sizes: Object.fromEntries(latest.assets.map(a => [a.name, a.size])) };
        render();
        countUp();
      }
    } catch (_) { /* offline or rate-limited: links still work, just no size/version */ }
  })();
</script>
</body>
</html>
