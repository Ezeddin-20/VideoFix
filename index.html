<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoFix</title>
<meta name="description" content="VideoFix – download videos, trim, split and extract audio on Android.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236d4aff'/%3E%3Cpath d='M38 30v40l32-20z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5fb; --card: #ffffff; --text: #17152b; --muted: #5d5a73;
    --accent: #6d4aff; --accent-text: #ffffff; --border: #e3e0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0e17; --card: #1a1826; --text: #f1effa; --muted: #a7a3bd; --accent: #8b6dff; --border: #2c2940; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
    line-height: 1.55;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  .lang { display: flex; gap: 6px; justify-content: center; margin-bottom: 28px; }
  .lang button {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); }
  header { text-align: center; }
  .logo { width: 88px; height: 88px; border-radius: 22px; background: var(--accent); display: inline-grid; place-items: center; }
  h1 { font-size: 32px; margin: 16px 0 4px; }
  .tagline { color: var(--muted); margin: 0 0 28px; }
  .count { display: inline-block; margin: -12px 0 24px; padding: 6px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); font-size: 15px; }
  .count b { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; text-align: center; }
  .download {
    display: block; width: 100%; padding: 16px; border-radius: 14px; border: 0;
    background: var(--accent); color: var(--accent-text); font: inherit; font-size: 19px; font-weight: 600;
    text-decoration: none;
  }
  .meta { color: var(--muted); font-size: 14px; margin-top: 10px; }
  #qr { display: inline-block; background: #fff; padding: 12px; border-radius: 12px; margin: 16px 0 4px; }
  #qr img, #qr canvas { display: block; }
  details { margin-top: 18px; text-align: start; }
  summary { cursor: pointer; color: var(--muted); font-size: 15px; }
  ul.files { list-style: none; padding: 0; margin: 12px 0 0; }
  ul.files li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 15px; }
  ul.files a { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
  ul.files span { color: var(--muted); }
  h2 { font-size: 18px; margin: 32px 0 10px; }
  ol, .features { padding-inline-start: 22px; margin: 0; }
  ol li, .features li { margin: 6px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .feature { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .feature b { display: block; margin-bottom: 2px; }
  .feature span { color: var(--muted); font-size: 15px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; }
  footer a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="ar">العربية</button>
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="de">Deutsch</button>
  </nav>

  <header>
    <div class="logo" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg>
    </div>
    <h1>VideoFix</h1>
    <p class="tagline" data-t="tagline"></p>
    <p class="count" id="count" hidden></p>
  </header>

  <section class="card">
    <!-- Android: one button, pre-picked for this phone -->
    <div id="android" hidden>
      <a class="download" id="mainLink" href="#" data-t="download"></a>
      <div class="meta" id="mainMeta"></div>
    </div>
    <!-- Anything else: direct download plus a QR code to open the page on a phone -->
    <div id="other" hidden>
      <a class="download" id="desktopLink" href="#" data-t="download"></a>
      <div class="meta" id="desktopMeta"></div>
      <p data-t="openOnPhone"></p>
      <div id="qr" aria-hidden="true"></div>
      <div class="meta" data-t="scan"></div>
    </div>

    <details>
      <summary data-t="otherDevices"></summary>
      <ul class="files" id="fileList"></ul>
    </details>
  </section>

  <h2 data-t="installTitle"></h2>
  <ol>
    <li data-t="step1"></li>
    <li data-t="step2"></li>
    <li data-t="step3"></li>
  </ol>

  <h2 data-t="featuresTitle"></h2>
  <div class="grid" id="features"></div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const REPO = "Ezeddin-20/VideoFix";
  // "latest/download/<name>" always resolves to the newest release, so this page never
  // needs editing for an update — as long as the APK file names stay the same.
  const fileUrl = name => `https://github.com/${REPO}/releases/latest/download/${name}`;
  const FILES = [
    { abi: "arm64-v8a",   name: "app-arm64-v8a-release.apk" },
    { abi: "armeabi-v7a", name: "app-armeabi-v7a-release.apk" },
    { abi: "universal",   name: "app-universal-release.apk" },
  ];
  // Listed under "if the app doesn't work"; arm64 is the main button.
  const LISTED = ["armeabi-v7a", "universal"];

  const T = {
    ar: {
      tagline: "نزّل الفيديوهات، قصّها وقسّمها، واستخرج الصوت — على أندرويد.",
      download: "تنزيل VideoFix",
      forDevice: "مناسب لهاتفك",
      forPhones: "لمعظم هواتف أندرويد",
      openOnPhone: "أو افتح هذه الصفحة مباشرة من هاتفك:",
      scan: "امسح الرمز بكاميرا الهاتف",
      otherDevices: "ظهرت رسالة «التطبيق غير مثبّت»؟",
      get: "تنزيل",
      desc: { "armeabi-v7a": "نزّل هذه النسخة (للهواتف القديمة)", "universal": "أو هذه — تعمل على كل الأجهزة (حجم أكبر)" },
      installTitle: "طريقة التثبيت",
      step1: "اضغط على زر التنزيل وانتظر حتى ينتهي.",
      step2: "افتح الملف. إذا طلب الهاتف ذلك، اسمح بـ «التثبيت من هذا المصدر».",
      step3: "اضغط «تثبيت». التحديثات القادمة تصلك من داخل التطبيق.",
      featuresTitle: "ماذا يفعل VideoFix؟",
      features: [
        ["تنزيل من كل مكان", "يوتيوب وتيك توك وإنستغرام وفيسبوك ومئات المواقع الأخرى."],
        ["قوائم تشغيل كاملة", "الصق رابط قائمة واختر: كل الفيديوهات أو فيديو واحد فقط."],
        ["الجودة التي تريدها", "جودة عالية أو متوسطة أو منخفضة — أو الصوت فقط."],
        ["صيغ وترجمات", "MP4 أو MKV أو WEBM، مع تنزيل الترجمة إذا أردت."],
        ["سريع وسهل", "انسخ الرابط وافتح التطبيق فيتعرّف عليه، أو شارك الفيديو مباشرة إلى VideoFix."],
        ["التنزيل في الخلفية", "استمر في استخدام هاتفك، والتقدّم يظهر في الإشعارات."],
        ["قص الفيديو", "احتفظ بالجزء الذي تريده فقط واحفظه أو شاركه."],
        ["تقسيم الفيديو", "قسّم الفيديو الطويل إلى أجزاء — مثالي لحالات واتساب."],
        ["استخراج الصوت", "حوّل أي فيديو إلى ملف صوتي."],
        ["مكتبة ومشغّل", "كل فيديوهاتك في مكان واحد مع مشغّل مدمج."],
        ["وصف صوتي بالذكاء الاصطناعي", "Gemini يصف الفيديو للمكفوفين وضعاف البصر."],
        ["عربي وإنجليزي وألماني", "مع الوضع الليلي والتحديثات التلقائية."],
      ],
      version: "الإصدار",
      downloads: n => `<b>${n.toLocaleString("ar")}</b> تنزيل`,
    },
    en: {
      tagline: "Download videos, trim and split them, extract the audio — on Android.",
      download: "Download VideoFix",
      forDevice: "Picked for your phone",
      forPhones: "For most Android phones",
      openOnPhone: "Or open this page directly on your phone:",
      scan: "Scan with your phone's camera",
      otherDevices: "Seeing “App not installed”?",
      get: "Download",
      desc: { "armeabi-v7a": "Get this version (older phones)", "universal": "Or this one — works on every device (larger)" },
      installTitle: "How to install",
      step1: "Tap the download button and wait until it finishes.",
      step2: "Open the file. If your phone asks, allow “Install from this source”.",
      step3: "Tap “Install”. Future updates arrive inside the app.",
      featuresTitle: "What does VideoFix do?",
      features: [
        ["Download from anywhere", "YouTube, TikTok, Instagram, Facebook and hundreds more sites."],
        ["Whole playlists", "Paste a playlist link and choose: every video or just one."],
        ["Your quality", "High, medium or low — or just the audio."],
        ["Formats & subtitles", "MP4, MKV or WEBM, with subtitles if you want them."],
        ["Fast and simple", "Copy a link and open the app — it spots it. Or share a video straight to VideoFix."],
        ["Background downloads", "Keep using your phone; progress shows in the notifications."],
        ["Trim", "Keep only the part you want, then save or share it."],
        ["Split", "Cut long videos into parts — perfect for WhatsApp status."],
        ["Extract audio", "Turn any video into an audio file."],
        ["Library & player", "All your videos in one place with a built-in player."],
        ["AI audio description", "Gemini describes the video for blind and low-vision viewers."],
        ["Arabic, English, German", "Plus dark mode and automatic updates."],
      ],
      version: "Version",
      downloads: n => `<b>${n.toLocaleString("en")}</b> downloads`,
    },
    de: {
      tagline: "Videos herunterladen, schneiden, teilen und den Ton extrahieren – auf Android.",
      download: "VideoFix herunterladen",
      forDevice: "Passend für dein Handy",
      forPhones: "Für die meisten Android-Handys",
      openOnPhone: "Oder öffne diese Seite direkt auf deinem Handy:",
      scan: "Mit der Handy-Kamera scannen",
      otherDevices: "Meldung „App nicht installiert“?",
      get: "Laden",
      desc: { "armeabi-v7a": "Lade diese Version (ältere Handys)", "universal": "Oder diese – läuft auf allen Geräten (größer)" },
      installTitle: "So installierst du es",
      step1: "Tippe auf den Download-Knopf und warte, bis er fertig ist.",
      step2: "Öffne die Datei. Falls das Handy fragt, erlaube „Aus dieser Quelle installieren“.",
      step3: "Tippe auf „Installieren“. Künftige Updates kommen direkt in der App.",
      featuresTitle: "Was kann VideoFix?",
      features: [
        ["Von überall herunterladen", "YouTube, TikTok, Instagram, Facebook und Hunderte weitere Seiten."],
        ["Ganze Playlists", "Playlist-Link einfügen und wählen: alle Videos oder nur eins."],
        ["Deine Qualität", "Hoch, mittel oder niedrig – oder nur der Ton."],
        ["Formate & Untertitel", "MP4, MKV oder WEBM, auf Wunsch mit Untertiteln."],
        ["Schnell und einfach", "Link kopieren, App öffnen – sie erkennt ihn. Oder ein Video direkt an VideoFix teilen."],
        ["Download im Hintergrund", "Handy weiter benutzen; der Fortschritt steht in den Benachrichtigungen."],
        ["Schneiden", "Nur den Teil behalten, den du willst, und speichern oder teilen."],
        ["Teilen in Stücke", "Lange Videos in Teile schneiden – ideal für den WhatsApp-Status."],
        ["Ton extrahieren", "Aus jedem Video eine Audiodatei machen."],
        ["Mediathek & Player", "Alle Videos an einem Ort, mit eingebautem Player."],
        ["KI-Audiobeschreibung", "Gemini beschreibt das Video für blinde und sehbehinderte Menschen."],
        ["Arabisch, Englisch, Deutsch", "Dazu Dunkelmodus und automatische Updates."],
      ],
      version: "Version",
      downloads: n => `<b>${n.toLocaleString("de")}</b> Downloads`,
    },
  };

  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  let lang = "ar";
  let pickedAbi = "arm64-v8a";
  let release = null; // { tag, sizes: {name: bytes} } once GitHub answers
  let totalDownloads = null; // every APK download across all releases

  const mb = bytes => Math.round(bytes / 1048576) + " MB";

  // Browsers don't reliably expose the CPU; arm64 runs on almost every phone from the last
  // years, so it's the default and only clear hints of something else override it.
  async function detectAbi() {
    if (/x86|x64|amd64|i686/i.test(ua)) return "universal";
    if (/armv7|armv8l/i.test(ua)) return "armeabi-v7a";
    try {
      const hints = await navigator.userAgentData?.getHighEntropyValues(["architecture", "bitness"]);
      if (hints?.architecture === "x86") return "universal";
      if (hints?.bitness === "32") return "armeabi-v7a";
    } catch (_) { /* no client hints */ }
    return "arm64-v8a";
  }

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
    const grid = document.getElementById("features");
    grid.replaceChildren(...t.features.map(([title, text]) => {
      const card = document.createElement("div");
      card.className = "feature";
      card.append(Object.assign(document.createElement("b"), { textContent: title }),
                  Object.assign(document.createElement("span"), { textContent: text }));
      return card;
    }));
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

    const count = document.getElementById("count");
    count.hidden = totalDownloads === null;
    if (totalDownloads !== null) count.innerHTML = t.downloads(totalDownloads);

    const picked = FILES.find(f => f.abi === pickedAbi);
    document.getElementById("mainLink").href = fileUrl(picked.name);
    const size = release?.sizes[picked.name];
    const versionInfo = [release && `${t.version} ${release.tag}`, size && mb(size)];
    document.getElementById("mainMeta").textContent = [t.forDevice, ...versionInfo].filter(Boolean).join(" · ");
    // Desktop: the arm64 APK fits nearly every phone, for copying over by cable or messenger.
    document.getElementById("desktopLink").href = fileUrl(FILES[0].name);
    document.getElementById("desktopMeta").textContent = [t.forPhones, ...versionInfo].filter(Boolean).join(" · ");

    document.getElementById("fileList").innerHTML = FILES.filter(f => LISTED.includes(f.abi)).map(f => {
      const s = release?.sizes[f.name];
      return `<li><span>${t.desc[f.abi]}${s ? " · " + mb(s) : ""}</span><a href="${fileUrl(f.name)}">${t.get}</a></li>`;
    }).join("");
  }

  function pickLanguage() {
    try {
      const saved = localStorage.getItem("lang");
      if (saved && T[saved]) return saved;
    } catch (_) {}
    const nav = (navigator.language || "ar").slice(0, 2);
    return T[nav] ? nav : "en";
  }

  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch (_) {}
    render();
  }));

  (async () => {
    lang = pickLanguage();
    document.getElementById(isAndroid ? "android" : "other").hidden = false;
    if (isAndroid) pickedAbi = await detectAbi();
    else if (window.QRCode) new QRCode(document.getElementById("qr"), { text: location.href, width: 180, height: 180 });
    render();
    try {
      // One request gives both: the newest release (list is newest first) and all download counts.
      const res = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`);
      if (res.ok) {
        const all = (await res.json()).filter(r => !r.draft && !r.prerelease);
        totalDownloads = all.flatMap(r => r.assets).reduce((sum, a) => sum + a.download_count, 0);
        const latest = all[0];
        if (latest) release = { tag: latest.tag_name.replace(/^v/i, ""), sizes: Object.fromEntries(latest.assets.map(a => [a.name, a.size])) };
        render();
      }
    } catch (_) { /* offline or rate-limited: links still work, just no size/version */ }
  })();
</script>
</body>
</html>
